<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 320 180" shape-rendering="crispEdges">
  <style>text{font-family:NanumGothic,Apple SD Gothic Neo,sans-serif}</style>
  <rect x="0" y="0" width="320" height="180" fill="#07111F"/>
  <text x="12" y="18" fill="#F4E9D5" font-size="12" font-weight="800" text-anchor="start">동행자 후일담</text><text x="12" y="29" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="start">선택한 관계가 로그아웃 이후에도 이어집니다.</text><line x1="12" y1="34" x2="308" y2="34" stroke="#1C3550" stroke-width="1"/><rect x="40" y="46" width="240" height="94" fill="#13253A" stroke="#47D7E8" stroke-width="1"/><rect x="70" y="65" width="10" height="10" fill="#91A2B5"/><rect x="67" y="75" width="16" height="32" fill="#91A2B5"/><rect x="64" y="103" width="22" height="7" fill="#91A2B5"/><text x="112" y="66" fill="#F4E9D5" font-size="11" font-weight="800" text-anchor="start">서윤</text><rect x="112" y="76" width="18" height="12" fill="#0D1B2C" stroke="#65D59A" stroke-width="1"/><text x="116" y="85" fill="#65D59A" font-size="6" font-weight="700" text-anchor="start">우정</text><text x="112" y="99" fill="#F4E9D5" font-size="7" font-weight="600" text-anchor="start">현실에서 다시 만날 날짜와 장소를</text><text x="112" y="112" fill="#F4E9D5" font-size="7" font-weight="600" text-anchor="start">구체적으로 정리해 메시지로 남겼다.</text><text x="112" y="130" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="start">다음 방송은 함께 준비하기로 했다.</text><line x1="12" y1="162" x2="308" y2="162" stroke="#1C3550" stroke-width="1"/><text x="14" y="174" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="start">Z  다음 후일담</text><text x="306" y="174" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="end">X  크레딧</text>
</svg>
