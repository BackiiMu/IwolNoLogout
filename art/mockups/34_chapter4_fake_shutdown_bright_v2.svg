<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 320 180" shape-rendering="crispEdges">
  <style>text{font-family:NanumGothic,Apple SD Gothic Neo,sans-serif}</style>
  <rect x="0" y="0" width="320" height="180" fill="#F7FCFF"/>
  <rect x="0" y="0" width="320" height="180" fill="#14324A"/><text x="16" y="22" fill="#C7E7F1" font-size="7" font-weight="600" text-anchor="start">방송 종료 처리 중…</text><rect x="82" y="52" width="156" height="74" fill="#FFFFFF" stroke="#14324A" stroke-width="1"/><text x="160" y="74" fill="#10283B" font-size="12" font-weight="800" text-anchor="middle">종료 완료</text><text x="160" y="92" fill="#557286" font-size="7" font-weight="600" text-anchor="middle">창을 닫아도 안전합니다.</text><text x="160" y="114" fill="#FF5573" font-size="7" font-weight="700" text-anchor="middle">아니야. 아직 보고 있어.</text><rect x="248" y="18" width="62" height="138" fill="#E8F7FF" stroke="#FF5573" stroke-width="1"/><text x="256" y="34" fill="#FF5573" font-size="6" font-weight="700" text-anchor="start">잘못된 채팅</text><text x="256" y="54" fill="#557286" font-size="6" font-weight="600" text-anchor="start">꺼졌어?</text><text x="256" y="70" fill="#557286" font-size="6" font-weight="600" text-anchor="start">아직 보여</text><text x="256" y="86" fill="#FF5573" font-size="6" font-weight="600" text-anchor="start">뒤를 봐</text>
</svg>
