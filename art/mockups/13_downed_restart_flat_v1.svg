  <rect x="0" y="0" width="320" height="180" fill="#02060C"/><text x="160" y="54" fill="#FF657A" font-size="14" font-weight="800" text-anchor="middle">연결이 끊어졌습니다</text><text x="160" y="74" fill="#91A2B5" font-size="7" font-weight="600" text-anchor="middle">마지막 체크포인트에서 다시 시작할 수 있습니다.</text><rect x="96" y="92" width="128" height="18" fill="#1C3550" stroke="#47D7E8" stroke-width="1"/><text x="104" y="105" fill="#F4E9D5" font-size="8" font-weight="700" text-anchor="start">체크포인트 재개</text><rect x="96" y="116" width="128" height="18" fill="#13253A" stroke="#02060C" stroke-width="1"/><text x="104" y="129" fill="#91A2B5" font-size="8" font-weight="700" text-anchor="start">타이틀로</text><text x="160" y="154" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="middle">저장 데이터는 손상되지 않았습니다.</text>
