<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 320 180" shape-rendering="crispEdges">
  <style>text{font-family:NanumGothic,Apple SD Gothic Neo,sans-serif}</style>
  <rect x="0" y="0" width="320" height="180" fill="#F3EFE6"/>
  <text x="12" y="18" fill="#1C2730" font-size="12" font-weight="800" text-anchor="start">동행자 확정</text><text x="12" y="29" fill="#66737D" font-size="6" font-weight="600" text-anchor="start">이 선택은 이번 회차에서 되돌릴 수 없습니다.</text><line x1="12" y1="34" x2="308" y2="34" stroke="#DDEFF2" stroke-width="1"/><rect x="58" y="46" width="204" height="92" fill="#FFF9EE" stroke="#20AFC1" stroke-width="1"/><rect x="88" y="65" width="10" height="10" fill="#66737D"/><rect x="85" y="75" width="16" height="26" fill="#66737D"/><rect x="82" y="97" width="22" height="7" fill="#66737D"/><text x="124" y="70" fill="#1C2730" font-size="12" font-weight="800" text-anchor="start">서윤</text><text x="124" y="86" fill="#66737D" font-size="7" font-weight="600" text-anchor="start">안정형 방송 매니저</text><text x="124" y="104" fill="#D99531" font-size="6" font-weight="700" text-anchor="start">확정하면 이후 후보 라운드는 종료됩니다.</text><rect x="80" y="116" width="72" height="16" fill="#FFF9EE" stroke="#24313D" stroke-width="1"/><text x="88" y="127" fill="#66737D" font-size="8" font-weight="700" text-anchor="start">다시 보기</text><rect x="168" y="116" width="72" height="16" fill="#DDEFF2" stroke="#20AFC1" stroke-width="1"/><text x="176" y="127" fill="#1C2730" font-size="8" font-weight="700" text-anchor="start">확정</text>
</svg>
