<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 320 180" shape-rendering="crispEdges">
  <style>text{font-family:NanumGothic,Apple SD Gothic Neo,sans-serif}</style>
  <rect x="0" y="0" width="320" height="180" fill="#F3EFE6"/>
  <text x="12" y="18" fill="#1C2730" font-size="12" font-weight="800" text-anchor="start">동행자 확정 완료</text><text x="12" y="29" fill="#66737D" font-size="6" font-weight="600" text-anchor="start">이후 후보 선택 화면은 열리지 않습니다.</text><line x1="12" y1="34" x2="308" y2="34" stroke="#DDEFF2" stroke-width="1"/><rect x="54" y="46" width="212" height="96" fill="#FFF9EE" stroke="#20AFC1" stroke-width="1"/><rect x="87" y="67" width="10" height="10" fill="#66737D"/><rect x="84" y="77" width="16" height="32" fill="#66737D"/><rect x="81" y="105" width="22" height="7" fill="#66737D"/><text x="132" y="70" fill="#1C2730" font-size="13" font-weight="800" text-anchor="start">서윤</text><rect x="132" y="80" width="33" height="12" fill="#E7E1D4" stroke="#20AFC1" stroke-width="1"/><text x="136" y="89" fill="#20AFC1" font-size="6" font-weight="700" text-anchor="start">고정 동행</text><text x="132" y="105" fill="#66737D" font-size="7" font-weight="600" text-anchor="start">선택 기록과 위험 경고를 지원합니다.</text><text x="132" y="120" fill="#1C2730" font-size="7" font-weight="600" text-anchor="start">모든 챕터와 엔딩을 함께합니다.</text><line x1="12" y1="162" x2="308" y2="162" stroke="#DDEFF2" stroke-width="1"/><text x="14" y="174" fill="#66737D" font-size="6" font-weight="600" text-anchor="start">Z  모험 계속</text><text x="306" y="174" fill="#66737D" font-size="6" font-weight="600" text-anchor="end">X  상세 보기</text>
</svg>
