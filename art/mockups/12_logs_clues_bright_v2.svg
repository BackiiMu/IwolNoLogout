  <text x="12" y="18" fill="#10283B" font-size="12" font-weight="800" text-anchor="start">로그 · 단서</text><text x="12" y="29" fill="#557286" font-size="6" font-weight="600" text-anchor="start">관리자 기록과 튜토의 행동을 비교합니다.</text><line x1="12" y1="34" x2="308" y2="34" stroke="#DDF6FF" stroke-width="1"/><rect x="12" y="42" width="82" height="110" fill="#FFFFFF" stroke="#14324A" stroke-width="1"/><text x="22" y="59" fill="#557286" font-size="7" font-weight="600" text-anchor="start">프롤로그</text><text x="22" y="75" fill="#10283B" font-size="7" font-weight="700" text-anchor="start">1장</text><rect x="16" y="69" width="3" height="8" fill="#00B8D9"/><text x="22" y="91" fill="#557286" font-size="7" font-weight="600" text-anchor="start">2장</text><text x="22" y="107" fill="#557286" font-size="7" font-weight="600" text-anchor="start">3장</text><text x="22" y="123" fill="#557286" font-size="7" font-weight="600" text-anchor="start">4장</text><text x="22" y="139" fill="#557286" font-size="7" font-weight="600" text-anchor="start">최종장</text><rect x="102" y="42" width="206" height="110" fill="#FFFFFF" stroke="#00B8D9" stroke-width="1"/><text x="112" y="56" fill="#10283B" font-size="8" font-weight="800" text-anchor="start">관리자 로그 01-03</text><rect x="246" y="48" width="33" height="12" fill="#E8F7FF" stroke="#FF5573" stroke-width="1"/><text x="250" y="57" fill="#FF5573" font-size="6" font-weight="700" text-anchor="start">부분 손상</text><text x="112" y="73" fill="#10283B" font-size="7" font-weight="600" text-anchor="start">권한: 문 열기 / 문 잠금</text><text x="112" y="88" fill="#10283B" font-size="7" font-weight="600" text-anchor="start">종료 요청 수신: 1회</text><text x="112" y="103" fill="#10283B" font-size="7" font-weight="600" text-anchor="start">종료 처리 결과:</text><rect x="206" y="95" width="76" height="10" fill="#14324A"/><text x="112" y="121" fill="#10283B" font-size="7" font-weight="600" text-anchor="start">복구 담당: TUTO</text><text x="112" y="138" fill="#00B8D9" font-size="7" font-weight="700" text-anchor="start