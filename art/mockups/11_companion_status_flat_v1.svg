<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 320 180" shape-rendering="crispEdges">
  <style>text{font-family:NanumGothic,Apple SD Gothic Neo,sans-serif}</style>
  <rect x="0" y="0" width="320" height="180" fill="#07111F"/>
  <text x="12" y="18" fill="#F4E9D5" font-size="12" font-weight="800" text-anchor="start">동행자</text><text x="12" y="29" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="start">확정한 동행자는 마지막까지 함께합니다.</text><line x1="12" y1="34" x2="308" y2="34" stroke="#1C3550" stroke-width="1"/><rect x="12" y="42" width="90" height="110" fill="#13253A" stroke="#47D7E8" stroke-width="1"/><rect x="52" y="59" width="10" height="10" fill="#91A2B5"/><rect x="49" y="69" width="16" height="26" fill="#91A2B5"/><rect x="46" y="91" width="22" height="7" fill="#91A2B5"/><text x="57" y="112" fill="#F4E9D5" font-size="10" font-weight="800" text-anchor="middle">서윤</text><rect x="32" y="122" width="33" height="12" fill="#0D1B2C" stroke="#47D7E8" stroke-width="1"/><text x="36" y="131" fill="#47D7E8" font-size="6" font-weight="700" text-anchor="start">고정 동행</text><rect x="110" y="42" width="198" height="110" fill="#13253A" stroke="#02060C" stroke-width="1"/><text x="120" y="57" fill="#F4E9D5" font-size="8" font-weight="700" text-anchor="start">방송 매니저</text><text x="120" y="72" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="start">신뢰</text><rect x="164" y="68" width="126" height="4" fill="#02060C"/><rect x="165" y="69" width="79" height="2" fill="#47D7E8"/><text x="120" y="88" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="start">상태</text><text x="290" y="88" fill="#65D59A" font-size="7" font-weight="700" text-anchor="end">안정</text><line x1="120" y1="98" x2="298" y2="98" stroke="#1C3550" stroke-width="1"/><text x="120" y="112" fill="#91A2B5" font-size="6" font-weight="700" text-anchor="start">고유 반응</text><text x="120" y="124" fill="#F4E9D5" font-size="6" font-weight="600" text-anchor="start">선택 기록을 정리해 위험한 결정을</text><text x="120" y="134" fill="#F4E9D5" font-size="6" font-weight="600" text-anchor="start">한 번 더 확인하도록 돕습니다.</text><line x1="12" y1="162" x2="308" y2="162" stroke="#1C3550" stroke-width="1"/><text x="14" y="174" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="start">Z  관계 기록</text><text x="306" y="174" fill="#91A2B5" font-size="6" font-weight="600" text-anchor="end">X  뒤로</text>
</svg>
