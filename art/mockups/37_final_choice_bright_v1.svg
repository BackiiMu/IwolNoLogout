<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 320 180" shape-rendering="crispEdges">
  <style>text{font-family:NanumGothic,Apple SD Gothic Neo,sans-serif}</style>
  <rect x="0" y="0" width="320" height="180" fill="#F3EFE6"/>
  <text x="12" y="18" fill="#1C2730" font-size="12" font-weight="800" text-anchor="start">마지막 선택</text><text x="12" y="29" fill="#66737D" font-size="6" font-weight="600" text-anchor="start">튜토의 권한, 기억, 작별 방식을 결정합니다.</text><line x1="12" y1="34" x2="308" y2="34" stroke="#DDEFF2" stroke-width="1"/><rect x="14" y="50" width="90" height="88" fill="#FFF9EE" stroke="#24313D" stroke-width="1"/><rect x="22" y="58" width="74" height="4" fill="#E95C70"/><text x="59" y="82" fill="#1C2730" font-size="9" font-weight="800" text-anchor="middle">권한 회수</text><text x="59" y="101" fill="#66737D" font-size="6" font-weight="600" text-anchor="middle">통제를 끝낸다</text><text x="59" y="123" fill="#66737D" font-size="6" font-weight="700" text-anchor="middle">검토</text><rect x="112" y="50" width="90" height="88" fill="#FFF9EE" stroke="#20AFC1" stroke-width="1"/><rect x="120" y="58" width="74" height="4" fill="#20AFC1"/><text x="157" y="82" fill="#1C2730" font-size="9" font-weight="800" text-anchor="middle">기억 분리</text><text x="157" y="101" fill="#66737D" font-size="6" font-weight="600" text-anchor="middle">기억만 보존한다</text><text x="157" y="123" fill="#20AFC1" font-size="6" font-weight="700" text-anchor="middle">선택 중</text><rect x="210" y="50" width="90" height="88" fill="#FFF9EE" stroke="#24313D" stroke-width="1"/><rect x="218" y="58" width="74" height="4" fill="#3FA66F"/><text x="255" y="82" fill="#1C2730" font-size="9" font-weight="800" text-anchor="middle">함께 작별</text><text x="255" y="101" fill="#66737D" font-size="6" font-weight="600" text-anchor="middle">책임을 확인한다</text><text x="255" y="123" fill="#66737D" font-size="6" font-weight="700" text-anchor="middle">검토</text><line x1="12" y1="162" x2="308" y2="162" stroke="#DDEFF2" stroke-width="1"/><text x="14" y="174" fill="#66737D" font-size="6" font-weight="600" text-anchor="start">Z  결정</text><text x="306" y="174" fill="#66737D" font-size="6" font-weight="600" text-anchor="end">X  기록 확인</text>
</svg>
