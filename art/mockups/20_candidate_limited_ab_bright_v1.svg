  <text x="12" y="18" fill="#1C2730" font-size="12" font-weight="800" text-anchor="start">후보 1라운드</text><text x="12" y="29" fill="#66737D" font-size="6" font-weight="600" text-anchor="start">제한 정보만 보고 첫인상을 남깁니다.</text><line x1="12" y1="34" x2="308" y2="34" stroke="#DDEFF2" stroke-width="1"/><rect x="20" y="48" width="132" height="94" fill="#FFF9EE" stroke="#20AFC1" stroke-width="1"/><text x="30" y="64" fill="#20AFC1" font-size="12" font-weight="800" text-anchor="start">A</text><rect x="81" y="68" width="10" height="10" fill="#66737D"/><rect x="78" y="78" width="16" height="22" fill="#66737D"/><rect x="75" y="96" width="22" height="7" fill="#66737D"/><text x="86" y="116" fill="#1C2730" font-size="8" font-weight="800" text-anchor="middle">안정형</text><text x="86" y="128" fill="#66737D" font-size="6" font-weight="600" text-anchor="middle">방송 관리</text><text x="86" y="138" fill="#D99531" font-size="6" font-weight="600" text-anchor="middle">공격 템포 감소</text><rect x="168" y="48" width="132" height="94" fill="#FFF9EE" stroke="#24313D" stroke-width="1"/><text x="178" y="64" fill="#66737D" font-size="12" font-weight="800" text-anchor="start">B</text><rect x="229" y="68" width="10" height="10" fill="#66737D"/><rect x="226" y="78" width="16" height="22" fill="#66737D"/><rect x="223" y="96" width="22" height="7" fill="#66737D"/><text x="234" y="116" fill="#1C2730" font-size="8" font-weight="800" text-anchor="middle">즉흥형</text><text x="234" y="128" fill="#66737D" font-size="6" font-weight="600" text-anchor="middle">현장 진행</text><text x="234" y="138" fill="#D99531" font-size="6" font-weight="600" text-anchor="middle">위험 판단 지연</text><text x="160" y="156" fill="#66737D" font-size="6" font-weight="600" text-anchor="middle">전체 프로필은 판정 후 동시에 공개됩니다.</text><line x1="12" y1="162" x2="308" y2="162" stroke="#DDEFF2" stroke-width="1"/><text x="14" y="174" fill="#66737D" font-size="6" font-weight="600" text-anchor="start">Z  첫인상 판정</text><text x="306" y="174" fill="#66737D" font-size="6" font-weight="600" text-anchor="end">X  나중에</text>
